<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prayer guide · Movement study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e2d6;color:#423a30;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 28px;display:grid;grid-template-columns:minmax(280px,1fr) 320px;gap:50px;align-items:center}.stage{position:relative;width:min(100%,calc((100vh - 72px)*9/16));margin:auto;aspect-ratio:9/16;background:#f4eddf url(assets/room.jpg) center/100% 100%;border-radius:12px;overflow:hidden;box-shadow:0 20px 70px #34291920}.stage.checker{background-image:conic-gradient(#dedbd5 25%,#f7f5f0 0 50%,#dedbd5 0 75%,#f7f5f0 0);background-size:24px 24px}canvas{width:100%;height:100%;display:block}h1{font:38px/1.12 Georgia,serif;margin:16px 0}p{line-height:1.65;color:#766a5b}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8e7c64}button{border:1px solid #c0b29f;border-radius:24px;padding:12px 20px;background:transparent;color:inherit;cursor:pointer;font:inherit}button.primary{background:#50634c;color:#fff;border-color:#50634c}button:focus-visible,input:focus-visible{outline:3px solid #a17645;outline-offset:3px}.buttons{display:flex;gap:8px;margin:25px 0 30px}input[type=range]{width:100%;accent-color:#50634c;margin:16px 0}.labels{display:flex;justify-content:space-between;font-size:12px;color:#817664}.options{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin:28px 0}.note{border-top:1px solid #cbbfad;padding-top:20px;font-size:12px}.error{color:#ad2e20}@media(max-width:700px){main{padding:18px;grid-template-columns:1fr;gap:22px}.stage{width:100%;aspect-ratio:9/16}aside{padding:0 10px 20px}h1{font-size:30px}}
</style><main><div class="stage" id="stage"><canvas id="guide" width="1080" height="1920" aria-label="Painted boy moving continuously between standing and bowing"></canvas></div><aside><span class="eyebrow">Prayer guide / movement study</span><h1>A gentle bow.</h1><p>One painted character, moving from standing into bowing and back. Pause anywhere to inspect the movement.</p><div class="buttons"><button class="primary" id="play">Play movement</button><button id="reverse">Return to standing</button></div><div class="labels"><span>Standing</span><span>Bowing</span></div><input id="progress" type="range" min="0" max="1000" value="0" aria-label="Movement progress"><div class="options"><label><input type="checkbox" id="loop" checked> Loop</label><label><input type="checkbox" id="transparent"> Transparency</label></div><p class="note">Web prototype · Standing and bowing only<br>Continuous movement with fixed feet and painted cloth. No image fades.</p><p id="status" role="status">Loading artwork…</p></aside></main><script type="module" src="motion.js"></script></html>
