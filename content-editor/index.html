<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Azkarify · Content editor</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div><span class="eyebrow">AZKARIFY</span><h1>Content editor</h1></div><div class="save-area"><span id="status" role="status" aria-live="polite">Loading content…</span><button id="save" disabled>Save changes</button></div></header>
<div class="layout"><aside><div class="filters"><label for="language">Collection</label><select id="language"><option value="en">English</option><option value="ar">العربية</option></select><label for="search">Search all text</label><input id="search" type="search" placeholder="Title, text, or category ID"><p id="summary"></p></div><nav id="categories" aria-label="Categories"></nav></aside>
<main id="editor"><p class="empty">Loading your local JSON files…</p></main></div>
<template id="entry-template"><article class="entry"><div class="entry-heading"><h3></h3><label class="repeat">Repeat count <input type="number" min="1" max="2147483647" step="1" required></label></div><div class="text-fields"></div><details><summary>Source audio</summary><a target="_blank" rel="noreferrer">Open audio</a></details></article></template>
</body></html>
